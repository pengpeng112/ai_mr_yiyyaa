          \ = joinNonEmpty([\n    '【异常检验结果】',\n    labs.length ? '' : '未提供异常检验结果',\n\
          \    ...labs.map(formatLabReport)\n  ], '\\n\\n');\n\n  const examSection\
          \ = joinNonEmpty([\n    '【检查报告】',\n    exams.length ? '' : '未提供检查报告',\n\
          \    ...exams.map(formatExamReport)\n  ], '\\n\\n');\n\n  const progressSection\
          \ = joinNonEmpty([\n    '【病程记录】',\n    progressRecords.length ? '' : '未提供病程记录',\n\
          \    ...progressRecords.map(formatProgressRecord)\n  ], '\\n\\n');\n\n \
          \ const nursingSection = joinNonEmpty([\n    '【护理记录】',\n    nursingRecords.length\
          \ ? '' : '未提供护理记录',\n    ...nursingRecords.map(formatNursingRecord)\n  ],\
          \ '\\n\\n');\n\n  return cleanText(\n    joinNonEmpty([\n      line('核查日期',\
          \ auditDate),\n      patientSection,\n      labSection,\n      examSection,\n\
          \      progressSection,\n      nursingSection,\n      formatRules(parsed.rules)\n\
          \    ], '\\n\\n')\n  );\n}\n\nfunction main(inputs) {\n  const inputObj\
          \ = inputs || {};\n  const mr_txt = inputObj.mr_txt || inputObj.mr_text\
          \ || '';\n\n  return {\n    result: buildLabExamAuditInputText(mr_txt)\n\
          \  };\n}"
