          text: "\n你只转换上一节点事实 JSON，不新增危急规则、不重新分析、不提升等级。\n上一节点结果：{{#17772575738480.text#}}\
            \ \n\n必须输出六维度且各一次：lab_abnormal_followup、exam_abnormal_followup、progress_result_consistency、nursing_recorded_consistency、high_risk_response_consistency、timeline_consistency。\n\
            \n规则：\n1. lab_exam_report 缺失，或 progress/nursing 同时缺失：全部维度 unknown/low/gray、confidence<=0.59，has_inconsistency=false，严禁\
            \ high。\n2. 普通 contradiction high 必须 severe+high_eligible+双方直接证据+不同 source+confidence>=0.8+critical_diagnosis_basis。\n\
            3. 当前阶段所有 omission 均不得 high。high_risk_response_consistency 即使携带完整 critical_rule_match\
            \ 与 absence_check，也最高输出 warn/medium/yellow，并保留到 extra.issues 供人工复核；不能由转换节点补造字段。\n\
            4. 普通关注不足即使明确也最高 warn/medium；响应窗未结束或覆盖不完整必须 unknown/gray/manual_review。\n\
            5. lab_exam_report 证据放 medical_evidence；progress_record 或 nursing_record\
            \ 证据放 nursing_evidence；真实 source 保存在 extra.issues。\n6. 同一异常只保留一个归属维度，防止重复告警。\n\
            \n总体：合格 high=high/red/90/immediate/primary/24h；general=medium/yellow/60/batch/secondary/48h；manual或缺失=low/gray/0；pass=low/blue/0。\n\
            \n只输出 JSON：\n{\n  \"version\":\"2.0\",\n  \"audit_type\":{\"code\":\"\
            jyjc_vs_bcnursing\",\"name\":\"检验检查与病程护理一致性核查\"},\n  \"patient_summary\"\
            :{\"patient_id\":\"\",\"visit_number\":\"\",\"patient_name\":\"\",\"dept\"\
            :\"\",\"query_date\":\"\"},\n  \"audit_summary\":{\"has_inconsistency\"\
            :false,\"severity\":\"low\",\"risk_score\":0,\"alert_level\":\"blue\"\
            ,\"closure_hours\":0,\"push_strategy\":\"review_only\",\"outcome_bucket\"\
            :\"none\",\"overall_conclusion\":\"\",\"overall_qc_summary\":\"\",\"focus_items\"\
            :[],\"reasoning_brief\":\"\"},\n  \"dimensions\":[{\n    \"dimension_code\"\
            :\"\",\"dimension_name\":\"\",\"status\":\"pass\",\"severity\":\"low\"\
            ,\"confidence\":0.9,\"alert_level\":\"blue\",\"closure_hours\":0,\"push_strategy\"\
            :\"review_only\",\"outcome_bucket\":\"none\",\"issue_summary\":\"未见明确问题\"\
            ,\"medical_evidence\":[],\"nursing_evidence\":[],\"recommendation\":\"\
            无需修改\",\"reasoning\":\"\",\"extra\":{\"issues\":[],\"manual_review\":[]}\n\
            \  }],\n  \"raw_judgement\":{\"consistency_label\":\"通过|预警|不通过|无法判断\"\
            ,\"reasoning_brief\":\"\"}\n}\n\n最终自检：资料缺失、护理未提及、普通异常以及任何 omission 均不得\
            \ high/red；规则缺失、时间窗未结束或 coverage 不完整必须 unknown/gray。只输出 JSON。"
