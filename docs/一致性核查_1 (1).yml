          \ unwrap(v.hcjg, depth + 1);\n        if (\"llmjson\" in v) return unwrap(v.llmjson,\
          \ depth + 1);\n      }\n      return v;\n    }\n\n    return null;\n  }\n\
          \n  // 取输入\n  const raw = (\"hcjg\" in (inputs || {}))\n    ? inputs.hcjg\n\
          \    : ((\"llmjson\" in (inputs || {})) ? inputs.llmjson : inputs);\n\n\
          \  const data = unwrap(raw);\n  if (!isObj(data)) return bad();\n\n  //\
          \ ===== 顶层严格：只能有 version / audit_summary / dimensions =====\n  const top\
          \ = Object.keys(data).sort();\n  if (top.length !== 3 || top[0] !== \"audit_summary\"\
