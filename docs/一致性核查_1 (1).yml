          \  const itemAllowed = [\n    \"dimension_code\",\n    \"dimension_name\"\
          ,\n    \"status\",\n    \"severity\",\n    \"alert_level\",\n    \"issue_summary\"\
          \n  ].sort();\n\n  for (const item of data.dimensions) {\n    if (!isObj(item))\
          \ return bad();\n\n    const keys = Object.keys(item).sort();\n    if (keys.length\
          \ !== itemAllowed.length) return bad();\n    for (let i = 0; i < itemAllowed.length;\
          \ i++) {\n      if (keys[i] !== itemAllowed[i]) return bad();\n    }\n\n\
          \    if (typeof item.dimension_code !== \"string\" || !item.dimension_code.trim())\
          \ return bad();\n    if (typeof item.dimension_name !== \"string\" || !item.dimension_name.trim())\
          \ return bad();\n    if (![\"pass\", \"fail\", \"unknown\", \"warn\"].includes(item.status))\
          \ return bad();\n    if (![\"low\", \"medium\", \"high\"].includes(item.severity))\
          \ return bad();\n    if (![\"blue\", \"yellow\", \"red\", \"gray\"].includes(item.alert_level))\
          \ return bad();\n    if (typeof item.issue_summary !== \"string\") return\
