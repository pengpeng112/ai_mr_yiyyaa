            - 初步诊断及其已记录依据。\n- 首次病程对关键病史、检查和既往治疗的记录情况。\n- 与年龄/性别明显不符的模板、其他患者信息、重复和明显文本错误。\n\
            \n问题分型：\n- contradiction：双方都有直接引文且含义不可调和。\n- omission：已有触发内容，但另一文书缺少应记录内容；一般只能\
