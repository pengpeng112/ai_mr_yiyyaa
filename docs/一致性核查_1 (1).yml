          \ return bad();\n  const summary = data.audit_summary;\n\n  const summaryAllowed\
          \ = [\n    \"has_inconsistency\",\n    \"severity\",\n    \"risk_score\"\
          ,\n    \"alert_level\",\n    \"overall_conclusion\",\n    \"focus_items\"\
