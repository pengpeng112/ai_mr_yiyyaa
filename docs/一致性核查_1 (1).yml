        prompt_template:
        - id: 0e36afdd-eb0a-438a-83e0-be2fe762f369
          role: system
          text: "\n你只转换上一节点事实 JSON，不重新分析或升级问题。\n上一节点结果：{{#1774272666540.text#}}\n\n\
            必须输出且只能输出六个维度，各一次：diagnosis_consistency、nursing_level_consistency、vital_sign_consistency、condition_consistency、treatment_measure_consistency、timeline_consistency。\n\
            \n规则：\n1. 任一文书缺失：六维度全部 unknown/low/gray、confidence<=0.59；has_inconsistency=false；写\
            \ manual_review；绝不能 high。\n2. high 仅允许同一 issue 满足 severe+high_eligible+contradiction+progress/nursing\
            \ 双侧证据非空+confidence>=0.8+受控 safety_category。\n3. warn 绝不能映射 high/red。general→warn/medium/yellow；hint→warn/low/blue；证据不足→unknown/gray。\n\
            4. progress_record 证据写 medical_evidence；nursing_record 证据写 nursing_evidence。\n\
            5. 原始 issue/manual review 保存至 extra。\n\n总体：合格 high=high/red/90/immediate/primary/24h；general=medium/yellow/60/batch/secondary/72h；hint=low/blue/20；manual或缺失=low/gray/0；pass=low/blue/0。\n\
            \n只输出 JSON：\n{\n  \"version\":\"2.0\",\n  \"audit_type\":{\"code\":\"\
            progress_vs_nursing\",\"name\":\"病程记录与护理记录一致性核查\"},\n  \"patient_summary\"\
            :{\"patient_id\":\"\",\"visit_number\":\"\",\"patient_name\":\"\",\"dept\"\
            :\"\",\"query_date\":\"\"},\n  \"audit_summary\":{\"has_inconsistency\"\
            :false,\"severity\":\"low\",\"risk_score\":0,\"alert_level\":\"blue\"\
            ,\"closure_hours\":0,\"push_strategy\":\"review_only\",\"outcome_bucket\"\
            :\"none\",\"overall_conclusion\":\"\",\"overall_qc_summary\":\"\",\"focus_items\"\
            :[],\"reasoning_brief\":\"\"},\n  \"dimensions\":[{\n    \"dimension_code\"\
            :\"\",\"dimension_name\":\"\",\"status\":\"pass\",\"severity\":\"low\"\
            ,\"confidence\":0.9,\"alert_level\":\"blue\",\"closure_hours\":0,\"push_strategy\"\
            :\"review_only\",\"outcome_bucket\":\"none\",\"issue_summary\":\"未见明确问题\"\
            ,\"medical_evidence\":[],\"nursing_evidence\":[],\"recommendation\":\"\
            无需修改\",\"reasoning\":\"\",\"extra\":{\"issues\":[],\"manual_review\":[]}\n\
            \  }],\n  \"raw_judgement\":{\"consistency_label\":\"一致|不一致|部分一致|无法判断\"\
            ,\"reasoning_brief\":\"\"}\n}\n\n最终自检：文书缺失、单方提及、不同时间状态变化和 warn 均不得 high/red；confidence<0.6\
            \ 必须 unknown/gray。只输出 JSON。"
        selected: false
