          \ => [d.code, d.name]));\n\n  function ok() { return { result: \"符合\" };\
          \ }\n  function bad() { return { result: \"不符合\" }; }\n\n  function isObj(v)\
          \ {\n    return Object.prototype.toString.call(v) === \"[object Object]\"\
          ;\n  }\n\n  // 解析：支持对象/字符串/```json ... ``` 包裹\n  function unwrap(v, depth\
