          \ > 100) return bad();\n  if (typeof summary.overall_conclusion !== \"string\"\
          ) return bad();\n  if (!Array.isArray(summary.focus_items)) return bad();\n\
          \  if (typeof summary.reasoning_brief !== \"string\") return bad();\n\n\
          \  // ===== dimensions 严格：必须 6 条、每条字段严格、code 唯一且齐全 =====\n  if (!Array.isArray(data.dimensions)\
