          \ pick(item, ['结果时间', 'result_time']))\n        ], '\\n');\n      }).join('\\\
          n')\n    ], '\\n');\n  }\n\n  return formatLabItem(lab, idx);\n}\n\nfunction\
          \ formatExamReport(item, idx) {\n  const exam = item || {};\n\n  return\
          \ joinNonEmpty([\n    '（检查报告' + (idx + 1) + '）',\n    line('检查号', pick(exam,\
