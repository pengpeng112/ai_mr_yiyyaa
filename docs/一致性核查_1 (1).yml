    - data:
        code: "function safeParse(value) {\n  if (value === null || value === undefined)\
          \ return null;\n  if (typeof value === 'object') return value;\n\n  const\
          \ text = String(value || '').trim();\n  if (!text) return null;\n\n  try\
          \ {\n    return JSON.parse(text);\n  } catch (e) {\n    return null;\n \
          \ }\n}\n\nfunction cleanText(value) {\n  return String(value || '')\n  \
          \  .replace(/\\r\\n/g, '\\n')\n    .replace(/\\r/g, '\\n')\n    .replace(/[\
          \ \\t]+\\n/g, '\\n')\n    .replace(/\\n{3,}/g, '\\n\\n')\n    .trim();\n\
          }\n\nfunction asArray(value) {\n  return Array.isArray(value) ? value :\
          \ [];\n}\n\nfunction joinNonEmpty(items, separator) {\n  return (items ||\
          \ [])\n    .map(function(item) {\n      return item === null || item ===\
          \ undefined ? '' : String(item).trim();\n    })\n    .filter(function(item)\
          \ {\n      return item !== '';\n    })\n    .join(separator || '\\n');\n\
          }\n\nfunction pick(obj, keys) {\n  if (!obj || typeof obj !== 'object')\
          \ return '';\n\n  for (var i = 0; i < keys.length; i += 1) {\n    var key\
          \ = keys[i];\n    var value = obj[key];\n\n    if (value !== null && value\
          \ !== undefined && String(value).trim() !== '') {\n      return value;\n\
          \    }\n  }\n\n  return '';\n}\n\nfunction line(label, value) {\n  if (value\
          \ === null || value === undefined || String(value).trim() === '') {\n  \
          \  return '';\n  }\n  return label + '：' + String(value).trim();\n}\n\n\
          function getAuditDate(parsed) {\n  return pick(parsed, ['audit_date', 'query_date'])\
          \ ||\n    pick(parsed['核查信息'], ['审核日期', '核查日期']);\n}\n\nfunction getPatient(parsed)\
          \ {\n  return parsed['患者信息'] || parsed.patient_info || parsed.patient_summary\
          \ || {};\n}\n\nfunction getLabReports(parsed) {\n  const structured = parsed['检验检查']\
          \ || {};\n  if (Array.isArray(structured['检验报告信息'])) return structured['检验报告信息'];\n\
          \n  if (Array.isArray(parsed.abnormal_labs)) return parsed.abnormal_labs;\n\
          \  if (parsed.abnormal_labs && Array.isArray(parsed.abnormal_labs.items))\
          \ return parsed.abnormal_labs.items;\n  if (Array.isArray(parsed.labs))\
          \ return parsed.labs;\n\n  return [];\n}\n\nfunction getExamReports(parsed)\
          \ {\n  const structured = parsed['检验检查'] || {};\n  if (Array.isArray(structured['检查报告']))\
          \ return structured['检查报告'];\n\n  if (Array.isArray(parsed.abnormal_exams))\
          \ return parsed.abnormal_exams;\n  if (parsed.abnormal_exams && Array.isArray(parsed.abnormal_exams.reports))\
          \ return parsed.abnormal_exams.reports;\n  if (Array.isArray(parsed.exams))\
          \ return parsed.exams;\n\n  return [];\n}\n\nfunction getProgressRecords(parsed)\
          \ {\n  if (parsed['病程'] && Array.isArray(parsed['病程']['病程记录'])) {\n    return\
          \ parsed['病程']['病程记录'];\n  }\n\n  if (Array.isArray(parsed.progress_context))\
          \ return parsed.progress_context;\n  if (parsed.progress_context && Array.isArray(parsed.progress_context.records))\
          \ return parsed.progress_context.records;\n  if (Array.isArray(parsed.progress_records))\
          \ return parsed.progress_records;\n\n  return [];\n}\n\nfunction getNursingRecords(parsed)\
          \ {\n  if (parsed['护理'] && Array.isArray(parsed['护理']['护理记录'])) {\n    return\
          \ parsed['护理']['护理记录'];\n  }\n\n  if (Array.isArray(parsed.nursing_context))\
          \ return parsed.nursing_context;\n  if (parsed.nursing_context && Array.isArray(parsed.nursing_context.records))\
          \ return parsed.nursing_context.records;\n  if (Array.isArray(parsed.nursing_records))\
          \ return parsed.nursing_records;\n\n  return [];\n}\n\nfunction formatLabItem(item,\
          \ idx) {\n  const lab = item || {};\n\n  return joinNonEmpty([\n    '（检验项目'\
          \ + (idx + 1) + '）',\n    line('检验单号', pick(lab, ['检验单号', 'test_no'])),\n\
          \    line('检验项目', pick(lab, ['检验项目', 'test_name'])),\n    line('报告项目名称',\
          \ pick(lab, ['报告项目名称', 'report_item_name', 'item_name'])),\n    line('检验结果',\
          \ pick(lab, ['检验结果', 'result'])),\n    line('单位', pick(lab, ['单位', 'units'])),\n\
          \    line('异常标记', pick(lab, ['异常标记', 'abnormal_indicator'])),\n    line('参考范围',\
          \ pick(lab, ['参考范围', 'reference_range', 'print_context'])),\n    line('结果时间',\
          \ pick(lab, ['结果时间', 'result_time']))\n  ], '\\n');\n}\n\nfunction formatLabReport(report,\
          \ idx) {\n  const lab = report || {};\n  const items = asArray(lab['报告项目']);\n\
          \n  if (items.length) {\n    return joinNonEmpty([\n      '（检验报告' + (idx\
          \ + 1) + '）',\n      line('检验单号', pick(lab, ['检验单号', 'test_no'])),\n   \
          \   line('检验项目', pick(lab, ['检验项目', 'test_name'])),\n      line('结果时间',\
          \ pick(lab, ['结果时间', 'result_time'])),\n      items.map(function(item, itemIdx)\
          \ {\n        return joinNonEmpty([\n          '  报告项目' + (itemIdx + 1),\n\
          \          line('  报告项目名称', pick(item, ['报告项目名称', 'report_item_name', 'item_name'])),\n\
          \          line('  检验结果', pick(item, ['检验结果', 'result'])),\n          line('\
