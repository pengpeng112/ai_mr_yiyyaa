          \ 'form_type', 'name'])),\n    line('护理内容', pick(record, ['护理内容', 'content',\
          \ 'text']))\n  ], '\\n');\n}\n\nfunction formatRules(rules) {\n  if (!rules)\
          \ return '';\n\n  if (Array.isArray(rules)) {\n    return joinNonEmpty([\n\
          \      '【配置核查规则】',\n      rules.map(function(rule, idx) {\n        return\
          \ (idx + 1) + '. ' + String(rule || '').trim();\n      }).join('\\n')\n\
          \    ], '\\n');\n  }\n\n  if (typeof rules === 'object') {\n    return joinNonEmpty([\n\
          \      '【配置核查规则】',\n      cleanText(JSON.stringify(rules, null, 2))\n  \
          \  ], '\\n');\n  }\n\n  return joinNonEmpty([\n    '【配置核查规则】',\n    rules\n\
          \  ], '\\n');\n}\n\nfunction buildLabExamAuditInputText(mr_txt) {\n  const\
          \ parsed = safeParse(mr_txt);\n\n  if (!parsed) {\n    return cleanText(mr_txt);\n\
          \  }\n\n  const patient = getPatient(parsed);\n  const labs = getLabReports(parsed);\n\
          \  const exams = getExamReports(parsed);\n  const progressRecords = getProgressRecords(parsed);\n\
