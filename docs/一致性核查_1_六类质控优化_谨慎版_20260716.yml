        code: "function safeParse(input) {\n  if (input && typeof input === 'object') return input;\n  if (typeof input !== 'string') return null;\n  try {\n    return JSON.parse(input);\n  } catch (e) {\n    return null;\n  }\n}\n\nfunction cleanText(value) {\n  return String(value || '')\n    .replace(/\\r\\n/g, '\\n')\n    .replace(/\\r/g, '\\n')\n    .replace(/[ \\t\\u3000]+/g, ' ')\n    .replace(/\\n{3,}/g, '\\n\\n')\n    .trim();\n}\n\nfunction line(label, value) {\n  const v = cleanText(value);\n  return v ? `${label}：${v}` : '';\n}\n\nfunction joinNonEmpty(arr, sep = '\\n') {\n  return arr.filter(Boolean).join(sep);\n}\n\nfunction formatVitals(vitals) {\n  const v = vitals || {};\n  const items = [\n    line('体温', v.temperature),\n    line('心率/脉搏', v.heart_rate_pulse),\n    line('呼吸', v.respiratory_rate),\n    line('血压', v.blood_pressure),\n    line('血氧饱和度', v.oxygen_saturation),\n    line('血糖', v.blood_glucose),\n  ].filter(Boolean);\n\n  return items.length ? `生命体征：${items.join('；')}` : '';\n}\n\n\nfunction formatAssessment(assessment) {\n  const a = assessment || {};\n  const items = [\n    line('意识', a.consciousness),\n    line('皮肤', a.skin_condition),\n    line('伤口', a.wound_condition),\n    line('管路', a.tube_care),\n    line('高风险', a.high_risk),\n  ].filter(Boolean);\n\n  return items.length ? `护理评估：${items.join('；')}` : '';\n}\n\nfunction formatSupportiveCare(care) {\n  const c = care || {};\n  const items = [\n    line('鼻导管吸氧', c.oxygen_nasal_cannula),\n    line('面罩吸氧', c.oxygen_mask),\n    line('入量', c.intake),\n    line('出量', c.output),\n    line('尿量', c.urine_volume),\n  ].filter(Boolean);\n\n  return items.length ? `支持治疗：${items.join('；')}` : '';\n}\n\nfunction buildAuditInputText(mr_txt) {\n  const parsed = safeParse(mr_txt);\n\n  // 如果不是 JSON，就直接清洗文本返回\n  if (!parsed) {\n    return cleanText(mr_txt);\n  }\n\n  const patient = parsed.patient_info || {};\n  const medicalDocs = Array.isArray(parsed.medical_documents) ? parsed.medical_documents : [];\n  const nursingRecords = Array.isArray(parsed.nursing_records) ? parsed.nursing_records : [];\n\n  const patientSection = joinNonEmpty([\n    '【患者基本信息】',\n    line('患者ID', patient.patient_id),\n    line('住院次数', patient.visit_number),\n    line('姓名', patient.patient_name),\n    line('性别', patient.gender),\n    line('出生日期', patient.birth_date),\n    line('入院日期', patient.admission_date),\n    line('出院日期', patient.discharge_date),\n    line('入院诊断', patient.admission_diagnosis),\n    line('出院主诊断', patient.discharge_main_diagnosis),\n    line('手术', patient.surgery),\n    line('入院科室', patient.admission_dept_name || patient.department),\n    line('出院科室', patient.discharge_dept_name),\n    line('护理级别医嘱', patient.nursing_level_order),\n  ]);\n\n  const medicalSection = joinNonEmpty([\n    '【病程记录】',\n    ...medicalDocs.map((doc, idx) =>\n      joinNonEmpty([\n        `（病程记录${idx + 1}）`,\n        line('时间', doc.document_time),\n        line('文书名称', doc.document_name),\n        line('签名医生', doc.signed_doctor),\n        line('内容', doc.content),\n      ], '\\n')\n    ),\n  ], '\\n\\n');\n\n  const nursingSection = joinNonEmpty([\n    '【护理记录】',\n    ...nursingRecords.map((rec, idx) =>\n      joinNonEmpty([\n        `（护理记录${idx + 1}）`,\n        line('时间', rec.record_time),\n        line('记录类型', rec.record_type),\n        line('记录人', rec.recorder),\n        line('内容', rec.content),\n        formatVitals(rec.vitals),\n        formatAssessment(rec.assessment),\n        formatSupportiveCare(rec.supportive_care),\n      ], '\\n')\n    ),\n  ], '\\n\\n');\n\n  return cleanText(\n    joinNonEmpty([\n      line('核查日期', parsed.audit_date),\n      line('匹配规则', parsed.match_rule),\n      patientSection,\n      medicalSection,\n      nursingSection,\n    ], '\\n\\n')\n  );\n}\n\nfunction main(inputs) {\n  const mr_txt = inputs.mr_txt || '';\n  return {\n    result: buildAuditInputText(mr_txt)\n  };\n}"
